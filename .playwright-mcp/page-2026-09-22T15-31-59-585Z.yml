          - paragraph [ref=f3e220]:
            - text: Structs are similar to classes in that they represent data structures that can contain data members and function members. However, unlike classes, structs are value types and do not require heap allocation. A variable of a
            - code [ref=f3e221]: struct
            - text: type directly contains the data of the
            - code [ref=f3e222]: struct
            - text: ", whereas a variable of a class type contains a reference to the data, the latter known as an object."
          - blockquote [ref=f3e223]:
            - paragraph [ref=f3e224]:
              - emphasis [ref=f3e225]: Note
              - text: ": Structs are particularly useful for small data structures that have value semantics. Complex numbers, points in a coordinate system, or key-value pairs in a dictionary are all good examples of structs. Key to these data structures is that they have few data members, that they do not require use of inheritance or reference semantics, rather they can be conveniently implemented using value semantics where assignment copies the value instead of the reference."
              - emphasis [ref=f3e226]: end note
          - paragraph [ref=f3e227]:
            - text: As described in
            - link "§8.3.5" [ref=f3e228] [cursor=pointer]:
              - /url: types#835-simple-types
            - text: ", the simple types provided by C#, such as"
            - code [ref=f3e229]: int
            - text: ","
            - code [ref=f3e230]: double
            - text: ", and"
            - code [ref=f3e231]: bool
            - text: ", are, in fact, all struct types."
          - generic [ref=f3e232]:
