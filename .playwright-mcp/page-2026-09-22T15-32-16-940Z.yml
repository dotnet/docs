          - group "Horizontally scrollable code" [ref=f4e1961]:
            - code [ref=f4e1962]: "using System; using System.Text; using System.Runtime.CompilerServices; [InterpolatedStringHandler] public ref struct LogInterpolatedStringHandler { StringBuilder builder; // Storage for the built-up string public LogInterpolatedStringHandler(int literalLength, int formattedCount) { builder = new StringBuilder(literalLength); } public void AppendLiteral(string s) { builder.Append(s); } public void AppendFormatted<T>(T t) { builder.Append(t?.ToString()); } public void AppendFormatted<T>(T t, string format) where T : IFormattable { builder.Append(t?.ToString(format, null)); } public void AppendFormatted<T>(T t, int alignment, string format) where T : IFormattable { builder.Append(String.Format(\"{0\" + \",\" + alignment + \":\" + format + \"}\", t)); } public override string ToString() => builder.ToString(); } public class Logger { public void LogMessage(string msg) { Console.WriteLine(msg); } public void LogMessage(LogInterpolatedStringHandler builder) { Console.WriteLine(builder.ToString()); } } public class Program { static void Main() { var logger = new Logger(); int val = 255; logger.LogMessage($\"val = {{{val,4:X}}}; 2 * val = {2 * val}.\"); } }"
