            - code [ref=f4e225]: private
            - text: .
          - paragraph [ref=f4e226]:
            - text: C# enables programmers to invent new kinds of declarative information, called
            - emphasis [ref=f4e227]:
              - strong [ref=f4e228]: attribute
            - text: s. Programmers can then attach attributes to various program entities, and retrieve attribute information in a run-time environment.
          - blockquote [ref=f4e229]:
            - paragraph [ref=f4e230]:
              - emphasis [ref=f4e231]: Note
              - text: ": For instance, a framework might define a"
              - code [ref=f4e232]: HelpAttribute
              - text: attribute that can be placed on certain program elements (such as classes and methods) to provide a mapping from those program elements to their documentation.
              - emphasis [ref=f4e233]: end note
          - paragraph [ref=f4e234]:
            - text: Attributes are defined through the declaration of attribute classes (
            - link "§23.2" [ref=f4e235] [cursor=pointer]:
              - /url: attributes#232-attribute-classes
            - text: ), which can have positional and named parameters (
            - link "§23.2.3" [ref=f4e236] [cursor=pointer]:
              - /url: attributes#2323-positional-and-named-parameters
            - text: ). Attributes are attached to entities in a C# program using attribute specifications (
            - link "§23.3" [ref=f4e237] [cursor=pointer]:
              - /url: attributes#233-attribute-specification
            - text: ), and can be retrieved at run-time as attribute instances (
            - link "§23.4" [ref=f4e238] [cursor=pointer]:
              - /url: attributes#234-attribute-instances
            - text: ).
          - generic [ref=f4e239]:
