          - paragraph [ref=f4e220]:
            - text: Much of the C# language enables the programmer to specify declarative information about the entities defined in the program. For example, the accessibility of a method in a class is specified by decorating it with the
            - emphasis [ref=f4e221]: method_modifier
            - text: s
