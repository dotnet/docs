          - paragraph [ref=f4e245]:
            - text: A class that derives from the abstract class
            - code [ref=f4e246]: System.Attribute
            - text: ", whether directly or indirectly, is an"
            - emphasis [ref=f4e247]:
              - strong [ref=f4e248]: attribute class
            - text: . The declaration of an attribute class defines a new kind of attribute that can be placed on program entities. By convention, attribute classes are named with a suffix of
            - code [ref=f4e249]: Attribute
