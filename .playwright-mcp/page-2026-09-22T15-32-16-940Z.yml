            - heading "23.5.6.1 General" [level=4] [ref=f4e1228]
          - paragraph [ref=f4e1229]: For purposes such as logging and reporting, it is sometimes useful for a function member to obtain certain compile-time information about the calling code. The caller-info attributes provide a way to pass such information transparently.
          - paragraph [ref=f4e1230]: When an optional parameter is annotated with one of the caller-info attributes, omitting the corresponding argument in a call does not necessarily cause the default parameter value to be substituted. Instead, if the specified information about the calling context is available, that information will be passed as the argument value.
          - blockquote [ref=f4e1231]:
            - paragraph [ref=f4e1232]:
              - emphasis [ref=f4e1233]: Example
              - text: ":"
            - generic [ref=f4e1234]:
              - generic [ref=f4e1235]: C#
              - button "Copy" [ref=f4e1237] [cursor=pointer]:
                - generic [ref=f4e1238]:
                  - generic [ref=f4e1239]: ＝
                  - generic [ref=f4e1240]: 
                - generic [ref=f4e1241]: Copy
            - code [ref=f4e1243]: "public void Log( [CallerLineNumber] int line = -1, [CallerFilePath] string path = null, [CallerMemberName] string name = null ) { Console.WriteLine((line < 0) ? \"No line\" : \"Line \"+ line); Console.WriteLine((path == null) ? \"No file path\" : path); Console.WriteLine((name == null) ? \"No member name\" : name); }"
            - paragraph [ref=f4e1244]:
              - text: A call to
              - code [ref=f4e1245]: Log()
              - text: with no arguments would print the line number and file path of the call, as well as the name of the member within which the call occurred.
            - paragraph [ref=f4e1246]:
              - emphasis [ref=f4e1247]: end example
          - paragraph [ref=f4e1248]: Caller-info attributes can occur on optional parameters anywhere, including in delegate declarations. However, the specific caller-info attributes have restrictions on the types of the parameters they can attribute, so that there will always be an implicit conversion from a substituted value to the parameter type.
          - paragraph [ref=f4e1249]: It is an error to have the same caller-info attribute on a parameter of both the defining and implementing part of a partial method or partial indexer declaration. Only caller-info attributes in the defining part are applied, whereas caller-info attributes occurring only in the implementing part are ignored.
          - paragraph [ref=f4e1250]:
            - text: Caller information does not affect overload resolution. As the attributed optional parameters are still omitted from the source code of the caller, overload resolution ignores those parameters in the same way it ignores other omitted optional parameters (
            - link "§12.6.4" [ref=f4e1251] [cursor=pointer]:
              - /url: expressions#1264-overload-resolution
            - text: ).
          - paragraph [ref=f4e1252]: Caller information is only substituted when a function is explicitly invoked in source code. Implicit invocations such as implicit parent constructor calls do not have a source location and will not substitute caller information. Also, calls that are dynamically bound will not substitute caller information. When a caller-info attributed parameter is omitted in such cases, the specified default value of the parameter is used instead.
          - paragraph [ref=f4e1253]: One exception is query expressions. These are considered syntactic expansions, and if the calls they expand to omit optional parameters with caller-info attributes, caller information will be substituted. The location used is the location of the query clause which the call was generated from.
          - paragraph [ref=f4e1254]:
            - text: "If more than one caller-info attribute is specified on a given parameter, they are recognized in the following order:"
            - code [ref=f4e1255]: CallerLineNumberAttribute
            - text: ","
            - code [ref=f4e1256]: CallerFilePathAttribute
            - text: ","
            - code [ref=f4e1257]: CallerMemberNameAttribute
            - text: ","
            - code [ref=f4e1258]: CallerArgumentExpressionAttribute
            - text: ". Consider the following parameter declaration:"
          - generic [ref=f4e1259]:
            - generic [ref=f4e1260]: C#
            - button "Copy" [ref=f4e1262] [cursor=pointer]:
