          - paragraph [ref=f4e490]:
            - text: An attribute consists of an
            - emphasis [ref=f4e491]: attribute_name
            - text: and an optional list of positional and named arguments. The positional arguments (if any) precede the named arguments. A positional argument consists of an
            - emphasis [ref=f4e492]: attribute_argument_expression
            - text: ; a named argument consists of a name, followed by an equal sign, followed by an
            - emphasis [ref=f4e493]: attribute_argument_expression
            - text: ", which, together, are constrained by the same rules as simple assignment. The order of named arguments is not significant."
          - blockquote [ref=f4e494]:
            - paragraph [ref=f4e495]:
              - emphasis [ref=f4e496]: Note
              - text: ": For convenience, a trailing comma is allowed in a"
              - emphasis [ref=f4e497]: global_attribute_section
              - text: and an
              - emphasis [ref=f4e498]: attribute_section
              - text: ", just as one is allowed in an"
              - emphasis [ref=f4e499]: array_initializer
              - text: (
              - link "§17.7" [ref=f4e500] [cursor=pointer]:
                - /url: arrays#177-array-initializers
              - text: ).
              - emphasis [ref=f4e501]: end note
          - paragraph [ref=f4e502]:
            - text: The
            - emphasis [ref=f4e503]: attribute_name
            - text: identifies an attribute class.
          - paragraph [ref=f4e504]:
            - text: When an attribute is placed at the global level, a
            - emphasis [ref=f4e505]: global_attribute_target_specifier
            - text: is required. When the
            - emphasis [ref=f4e506]: global_attribute_target
            - text: "is equal to:"
          - list [ref=f4e507]:
            - listitem [ref=f4e508]:
              - code [ref=f4e509]: assembly
              - text: — the target is the containing assembly
            - listitem [ref=f4e510]:
              - code [ref=f4e511]: module
              - text: — the target is the containing module
          - paragraph [ref=f4e512]:
            - text: No other values for
            - emphasis [ref=f4e513]: global_attribute_target
            - text: are allowed.
          - paragraph [ref=f4e514]:
            - text: The standardized
            - emphasis [ref=f4e515]: attribute_target
            - text: names are
            - code [ref=f4e516]: event
            - text: ","
            - code [ref=f4e517]: field
            - text: ","
            - code [ref=f4e518]: method
            - text: ","
            - code [ref=f4e519]: param
            - text: ","
            - code [ref=f4e520]: property
            - text: ","
            - code [ref=f4e521]: return
            - text: ","
            - code [ref=f4e522]: type
            - text: ", and"
            - code [ref=f4e523]: typevar
            - text: ". These target names shall only be used in the following contexts:"
          - list [ref=f4e524]:
            - listitem [ref=f4e525]:
              - code [ref=f4e526]: event
              - text: — an event.
            - listitem [ref=f4e527]:
              - code [ref=f4e528]: field
              - text: — a field. A field-like event (i.e., one without accessors) (
              - link "§15.8.2" [ref=f4e529] [cursor=pointer]:
                - /url: classes#1582-field-like-events
              - text: ) and an automatically implemented property (
              - link "§15.7.4" [ref=f4e530] [cursor=pointer]:
                - /url: classes#1574-automatically-implemented-properties
              - text: ) can also have an attribute with this target.
            - listitem [ref=f4e531]:
              - code [ref=f4e532]: method
              - text: — a constructor; finalizer; method; local function; operator; property get, set, and init accessors; indexer get, set, and init accessors; event add and remove accessors; and lambda expressions. A field-like event (i.e., one without accessors) can also have an attribute with this target.
            - listitem [ref=f4e533]:
              - code [ref=f4e534]: param
              - text: — property set and init accessors, indexer set and init accessors, event add and remove accessors, and a parameter in a constructor, method, local function, and operator.
            - listitem [ref=f4e535]:
              - code [ref=f4e536]: property
              - text: — a property and an indexer.
            - listitem [ref=f4e537]:
              - code [ref=f4e538]: return
              - text: — a delegate, method, local function, operator, property get accessor, indexer get accessor, and lambda expression.
            - listitem [ref=f4e539]:
              - code [ref=f4e540]: type
              - text: — a delegate, class, struct, enum, and interface.
            - listitem [ref=f4e541]:
              - code [ref=f4e542]: typevar
              - text: — a type parameter.
          - paragraph [ref=f4e543]:
            - text: Certain contexts permit the specification of an attribute on more than one target. A program can explicitly specify the target by including an
            - emphasis [ref=f4e544]: attribute_target_specifier
            - text: . Without an
            - emphasis [ref=f4e545]: attribute_target_specifier
            - text: a default is applied, but an
            - emphasis [ref=f4e546]: attribute_target_specifier
            - text: "can be used to affirm or override the default. The contexts are resolved as follows:"
          - list [ref=f4e547]:
            - listitem [ref=f4e548]:
              - text: For an attribute on a delegate declaration the default target is the delegate. Otherwise when the
              - emphasis [ref=f4e549]: attribute_target
              - text: "is equal to:"
              - list [ref=f4e550]:
                - listitem [ref=f4e551]:
                  - code [ref=f4e552]: type
                  - text: — the target is the delegate
                - listitem [ref=f4e553]:
                  - code [ref=f4e554]: return
                  - text: — the target is the return value
            - listitem [ref=f4e555]:
              - text: For an attribute on a method declaration the default target is the method. Otherwise when the
              - emphasis [ref=f4e556]: attribute_target
              - text: "is equal to:"
              - list [ref=f4e557]:
                - listitem [ref=f4e558]:
                  - code [ref=f4e559]: method
                  - text: — the target is the method
                - listitem [ref=f4e560]:
                  - code [ref=f4e561]: return
                  - text: — the target is the return value
            - listitem [ref=f4e562]:
              - text: For an attribute on a local function declaration the default target is the local function. Otherwise when the
              - emphasis [ref=f4e563]: attribute_target
              - text: "is equal to:"
              - list [ref=f4e564]:
                - listitem [ref=f4e565]:
                  - code [ref=f4e566]: method
                  - text: — the target is the local function
                - listitem [ref=f4e567]:
                  - code [ref=f4e568]: return
                  - text: — the target is the return value
            - listitem [ref=f4e569]:
              - text: For an attribute on an operator declaration the default target is the operator. Otherwise when the
              - emphasis [ref=f4e570]: attribute_target
              - text: "is equal to:"
              - list [ref=f4e571]:
                - listitem [ref=f4e572]:
                  - code [ref=f4e573]: method
                  - text: — the target is the operator
                - listitem [ref=f4e574]:
                  - code [ref=f4e575]: return
                  - text: — the target is the return value
            - listitem [ref=f4e576]:
              - text: For an attribute on a get accessor declaration for a property or indexer declaration the default target is the associated method. Otherwise when the
              - emphasis [ref=f4e577]: attribute_target
              - text: "is equal to:"
              - list [ref=f4e578]:
                - listitem [ref=f4e579]:
                  - code [ref=f4e580]: method
                  - text: — the target is the associated method
                - listitem [ref=f4e581]:
                  - code [ref=f4e582]: return
                  - text: — the target is the return value
            - listitem [ref=f4e583]:
              - text: For an attribute specified on a set or init accessor for a property or indexer declaration the default target is the associated method. Otherwise when the
              - emphasis [ref=f4e584]: attribute_target
              - text: "is equal to:"
              - list [ref=f4e585]:
                - listitem [ref=f4e586]:
                  - code [ref=f4e587]: method
                  - text: — the target is the associated method
                - listitem [ref=f4e588]:
                  - code [ref=f4e589]: param
                  - text: — the target is the lone implicit parameter
            - listitem [ref=f4e590]:
              - text: For an attribute on an automatically implemented property declaration the default target is the property. Otherwise when the
              - emphasis [ref=f4e591]: attribute_target
              - text: "is equal to:"
              - list [ref=f4e592]:
                - listitem [ref=f4e593]:
                  - code [ref=f4e594]: field
                  - text: — the target is the compiler-generated backing field for the property
            - listitem [ref=f4e595]:
              - text: For an attribute specified on an event declaration that omits
              - emphasis [ref=f4e596]: event_accessor_declarations
              - text: the default target is the event declaration. Otherwise when the
              - emphasis [ref=f4e597]: attribute_target
              - text: "is equal to:"
              - list [ref=f4e598]:
                - listitem [ref=f4e599]:
                  - code [ref=f4e600]: event
                  - text: — the target is the event declaration
                - listitem [ref=f4e601]:
                  - code [ref=f4e602]: field
                  - text: — the target is the field
                - listitem [ref=f4e603]:
                  - code [ref=f4e604]: method
                  - text: — the targets are the methods
            - listitem [ref=f4e605]:
              - text: In the case of an event declaration that does not omit
              - emphasis [ref=f4e606]: event_accessor_declarations
              - text: the default target is the method.
              - list [ref=f4e607]:
                - listitem [ref=f4e608]:
                  - code [ref=f4e609]: method
                  - text: — the target is the associated method
                - listitem [ref=f4e610]:
                  - code [ref=f4e611]: param
                  - text: — the target is the lone parameter
            - listitem [ref=f4e612]:
              - text: For an attribute on a
              - emphasis [ref=f4e613]: lambda_expression
              - text: the default target is the method. Otherwise when the
              - emphasis [ref=f4e614]: attribute_target
              - text: "is equal to:"
              - list [ref=f4e615]:
                - listitem [ref=f4e616]:
                  - code [ref=f4e617]: method
                  - text: — the target is the method
                - listitem [ref=f4e618]:
                  - code [ref=f4e619]: return
                  - text: — the target is the return value
          - paragraph [ref=f4e620]:
            - text: In all other contexts, inclusion of an
            - emphasis [ref=f4e621]: attribute_target_specifier
            - text: is permitted but unnecessary.
          - blockquote [ref=f4e622]:
            - paragraph [ref=f4e623]:
              - emphasis [ref=f4e624]: Example
              - text: ": a class declaration may either include or omit the specifier"
              - code [ref=f4e625]: type
              - text: ":"
            - generic [ref=f4e626]:
              - generic [ref=f4e627]: C#
              - button "Copy" [ref=f4e629] [cursor=pointer]:
                - generic [ref=f4e630]:
                  - generic [ref=f4e631]: ＝
                  - generic [ref=f4e632]: 
                - generic [ref=f4e633]: Copy
            - code [ref=f4e635]: "[type: Author(\"Brian Kernighan\")] class Class1 {} [Author(\"Dennis Ritchie\")] class Class2 {}"
            - paragraph [ref=f4e636]:
              - emphasis [ref=f4e637]: end example
              - text: .
          - paragraph [ref=f4e638]:
            - text: An implementation can accept other
            - emphasis [ref=f4e639]: attribute_target
            - text: s, the purposes of which are implementation defined. An implementation that does not recognize such an
            - emphasis [ref=f4e640]: attribute_target
            - text: shall issue a warning and ignore the containing
            - emphasis [ref=f4e641]: attribute_section
            - text: .
          - paragraph [ref=f4e642]:
            - text: By convention, attribute classes are named with a suffix of
            - code [ref=f4e643]: Attribute
            - text: . An
            - emphasis [ref=f4e644]: attribute_name
            - text: can either include or omit this suffix. Specifically, an
            - emphasis [ref=f4e645]: attribute_name
            - text: "is resolved as follows:"
          - list [ref=f4e646]:
            - listitem [ref=f4e647]:
              - text: If the right-most identifier of the
              - emphasis [ref=f4e648]: attribute_name
              - text: is a verbatim identifier (
              - link "§6.4.3" [ref=f4e649] [cursor=pointer]:
                - /url: lexical-structure#643-identifiers
              - text: ), then the
              - emphasis [ref=f4e650]: attribute_name
              - text: is resolved as a
              - emphasis [ref=f4e651]: type_name
              - text: (
              - link "§7.7" [ref=f4e652] [cursor=pointer]:
                - /url: basic-concepts#77-namespace-and-type-names
              - text: ). If the result is not a type derived from
              - code [ref=f4e653]: System.Attribute
              - text: ", a compile-time error occurs."
            - listitem [ref=f4e654]:
              - text: Otherwise,
              - list [ref=f4e655]:
                - listitem [ref=f4e656]:
                  - text: The
                  - emphasis [ref=f4e657]: attribute_name
                  - text: is resolved as a
                  - emphasis [ref=f4e658]: type_name
                  - text: (
                  - link "§7.7" [ref=f4e659] [cursor=pointer]:
                    - /url: basic-concepts#77-namespace-and-type-names
                  - text: ) except any errors are suppressed. If this resolution is successful and results in a type derived from
                  - code [ref=f4e660]: System.Attribute
                  - text: then the type is the result of this step.
                - listitem [ref=f4e661]:
                  - text: The characters
                  - code [ref=f4e662]: Attribute
                  - text: are appended to the right-most identifier in the
                  - emphasis [ref=f4e663]: attribute_name
                  - text: and the resulting string of tokens is resolved as a
                  - emphasis [ref=f4e664]: type_name
                  - text: (
                  - link "§7.7" [ref=f4e665] [cursor=pointer]:
