          - paragraph [ref=f4e463]:
            - text: Attributes are specified in
            - emphasis [ref=f4e464]:
              - strong [ref=f4e465]: attribute section
            - text: s. An attribute section consists of a pair of square brackets, which surround a comma-separated list of one or more attributes. The order in which attributes are specified in such a list, and the order in which sections attached to the same program entity are arranged, is not significant. For instance, the attribute specifications
            - code [ref=f4e466]: "[A][B]"
            - text: ","
            - code [ref=f4e467]: "[B][A]"
            - text: ","
            - code [ref=f4e468]: "[A, B]"
            - text: ", and"
            - code [ref=f4e469]: "[B, A]"
            - text: are equivalent.
          - generic [ref=f4e470]:
            - generic [ref=f4e471]: ANTLR
            - button "Copy" [ref=f4e473] [cursor=pointer]:
              - generic [ref=f4e474]:
                - generic [ref=f4e475]: ＝
                - generic [ref=f4e476]: 
              - generic [ref=f4e477]: Copy
          - code [ref=f4e479]: "global_attributes : global_attribute_section+ ; global_attribute_section : '[' global_attribute_target_specifier attribute_list ']' ; global_attribute_target_specifier : global_attribute_target ':' ; global_attribute_target : identifier ; attributes : attribute_section+ ; attribute_section : '[' attribute_target_specifier? attribute_list ']' ; attribute_target_specifier : attribute_target ':' ; attribute_target : identifier | keyword ; attribute_list : attribute (',' attribute)* ','? ; attribute : attribute_name attribute_arguments? ; attribute_name : type_name ; attribute_arguments : '(' ')' | '(' positional_argument_list (',' named_argument_list)? ')' | '(' named_argument_list ')' ; positional_argument_list : positional_argument (',' positional_argument)* ; positional_argument : argument_name? attribute_argument_expression ; named_argument_list : named_argument (',' named_argument)* ; named_argument : identifier '=' attribute_argument_expression ; attribute_argument_expression : non_assignment_expression ;"
          - paragraph [ref=f4e480]:
            - text: For the production
